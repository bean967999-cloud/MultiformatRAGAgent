[project]
name = "multiformat-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "openpyxl>=3.1.5",
    "pymilvus>=3.0.1",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-pptx>=1.0.2",
    "requests>=2.28.1",
    "sentence-transformers==6.0.1",
    "torch>=2.14.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
